<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cover Letter Generator</title>
<style>
  :root {
    --accent: #2563af;
    --ink: #1f2937;
    --grey: #55606b;
    --border: #d9dee3;
    --bg: #ffffff;
    --panel-bg: #f7f9fb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --accent: #6ea8ff;
      --ink: #eef1f5;
      --grey: #aab3bd;
      --border: #3a4048;
      --bg: #1b1d21;
      --panel-bg: #232629;
    }
  }
  :root[data-theme="dark"] {
    --accent: #6ea8ff;
    --ink: #eef1f5;
    --grey: #aab3bd;
    --border: #3a4048;
    --bg: #1b1d21;
    --panel-bg: #232629;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    padding: 28px 20px 60px;
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 4px;
    color: var(--ink);
  }
  p.sub {
    margin: 0 0 24px;
    color: var(--grey);
    font-size: 14px;
  }
  .fields {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 22px;
  }
  .field {
    flex: 1 1 220px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  label {
    font-size: 13px;
    font-weight: 600;
    color: var(--grey);
  }
  input {
    font-size: 15px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel-bg);
    color: var(--ink);
    outline: none;
  }
  input:focus {
    border-color: var(--accent);
  }
  .letter {
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px 36px;
    line-height: 1.65;
    font-size: 15px;
    white-space: pre-wrap;
    max-width: 100%;
    overflow-wrap: break-word;
  }
  .letter .name {
    text-align: center;
    font-weight: 700;
    font-size: 20px;
    margin-bottom: 2px;
  }
  .letter .contact {
    text-align: center;
    color: var(--grey);
    font-size: 13px;
    padding-bottom: 14px;
    border-bottom: 2px solid var(--accent);
    margin-bottom: 20px;
  }
  .letter .body-text {
    margin: 0 0 16px;
  }
  mark {
    background: none;
    color: var(--accent);
    font-weight: 600;
    padding: 0 1px;
  }
  .actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    flex-wrap: wrap;
  }
  button {
    font-size: 14px;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 8px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button.secondary {
    background: transparent;
    color: var(--accent);
  }
  button:active {
    transform: translateY(1px);
  }
  .toast {
    display: inline-block;
    margin-left: 4px;
    font-size: 13px;
    color: var(--grey);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .toast.show {
    opacity: 1;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Cover Letter Generator</h1>
    <p class="sub">Fill in the company and role — the letter updates as you type.</p>

    <div class="fields">
      <div class="field">
        <label for="company">Company Name</label>
        <input id="company" type="text" placeholder="e.g. Acme Corp" autocomplete="off">
      </div>
      <div class="field">
        <label for="position">Position Title</label>
        <input id="position" type="text" placeholder="e.g. Senior Software Engineer" autocomplete="off">
      </div>
    </div>

    <div class="letter" id="letter"></div>

    <div class="actions">
      <button id="copyBtn">Copy to Clipboard</button>
      <button id="downloadPdfBtn">Download as PDF</button>
      <button id="downloadBtn" class="secondary">Download as .txt</button>
      <span class="toast" id="toast"></span>
    </div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
  const companyInput = document.getElementById('company');
  const positionInput = document.getElementById('position');
  const letterEl = document.getElementById('letter');
  const toast = document.getElementById('toast');

  const paragraphs = [
    "Dear Hiring Manager,",
    "I'm writing to apply for the {POSITION} role at {COMPANY}. As a Software Engineer at NLP Logix, an AI consultancy building custom machine learning and generative AI solutions for enterprise clients, I design and deploy backend systems, manage cloud infrastructure on AWS and Azure, and help move models from research into production. I'm excited by the opportunity to bring that experience to {COMPANY} and take on a role with greater ownership and scope.",
    "In my current role, I work across the full delivery lifecycle: building scalable backend services and APIs, setting up CI/CD pipelines and automated deployment workflows, and collaborating with data scientists to train, fine-tune, and integrate machine learning and generative AI models into client-facing products. I've also contributed full-stack features, applied DevOps practices to keep systems reliable at scale, and taken ownership of testing and performance tuning across projects. Before NLP Logix, I worked as an IT Technician, Data Analyst, and Software Developer, which gave me a solid foundation in infrastructure, data-driven decision-making, and writing production-quality code.",
    "I hold a B.S. in Computer Science from the University of North Florida and am currently pursuing an M.S. in Analytics at the Georgia Institute of Technology, which has sharpened my ability to apply statistical and machine learning methods to real engineering problems. I'm drawn to {COMPANY} because of the opportunity to keep growing as an engineer while contributing to meaningful, technically ambitious work, and I'd welcome the chance to discuss how my background in cloud architecture, DevOps, and applied AI could support your team.",
    "Thank you for your time and consideration. I look forward to the opportunity to speak further.",
    "Sincerely,",
    "Aziz Bek"
  ];

  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function currentValues() {
    const company = companyInput.value.trim() || "[Company Name]";
    const position = positionInput.value.trim() || "[Position Title]";
    return { company, position };
  }

  function buildPlainText() {
    const { company, position } = currentValues();
    const filled = paragraphs.map(p => p.replaceAll("{COMPANY}", company).replaceAll("{POSITION}", position));
    return "Aziz Bek\n(904) 208-0824 | azizzbek.io@gmail.com | linkedin.com/in/azezbek | Jacksonville, FL\n\n" + filled.join("\n\n");
  }

  function render() {
    const { company, position } = currentValues();
    const companyFilled = companyInput.value.trim().length > 0;
    const positionFilled = positionInput.value.trim().length > 0;

    let html = '<div class="name">Aziz Bek</div>';
    html += '<div class="contact">(904) 208-0824 &nbsp;|&nbsp; azizzbek.io@gmail.com &nbsp;|&nbsp; linkedin.com/in/azezbek &nbsp;|&nbsp; Jacksonville, FL</div>';

    paragraphs.forEach(p => {
      let text = escapeHtml(p);
      text = text.replaceAll("{POSITION}", `<mark>${escapeHtml(position)}</mark>`);
      text = text.replaceAll("{COMPANY}", `<mark>${escapeHtml(company)}</mark>`);
      html += `<p class="body-text">${text}</p>`;
    });

    letterEl.innerHTML = html;
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1800);
  }

  companyInput.addEventListener('input', render);
  positionInput.addEventListener('input', render);
  render();

  document.getElementById('copyBtn').addEventListener('click', async () => {
    const text = buildPlainText();
    try {
      await navigator.clipboard.writeText(text);
      showToast('Copied!');
    } catch (e) {
      showToast('Could not copy — select and copy manually.');
    }
  });

  document.getElementById('downloadBtn').addEventListener('click', async () => {
    const text = buildPlainText();
    const { company } = currentValues();
    const safeName = company.replace(/[^a-z0-9]+/gi, '_').replace(/^_+|_+$/g, '') || 'Company';
    const filename = `Aziz_Bek_Cover_Letter_${safeName}.txt`;

    try {
      const downloads = await claude.use('downloads');
      if (downloads) {
        await downloads.save({ filename, data: text });
        showToast('Download started');
        return;
      }
    } catch (e) {
      // fall through to blob fallback
    }

    try {
      const blob = new Blob([text], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Download started');
    } catch (e) {
      showToast('Download not available — try Copy instead.');
    }
  });

  function buildPdfBlob() {
    const { jsPDF } = window.jspdf;
    const { company, position } = currentValues();
    const filled = paragraphs.map(p => p.replaceAll("{COMPANY}", company).replaceAll("{POSITION}", position));

    const doc = new jsPDF({ unit: 'pt', format: 'letter' });
    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    const margin = 63; // ~0.875in
    const usableWidth = pageWidth - margin * 2;
    let y = margin + 6;

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(19);
    doc.setTextColor(31, 41, 55); // ink
    doc.text('Aziz Bek', pageWidth / 2, y, { align: 'center' });
    y += 20;

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(10.5);
    doc.setTextColor(85, 96, 107); // grey
    doc.text('(904) 208-0824  |  azizzbek.io@gmail.com  |  linkedin.com/in/azezbek  |  Jacksonville, FL', pageWidth / 2, y, { align: 'center' });
    y += 14;

    doc.setDrawColor(37, 99, 175); // accent
    doc.setLineWidth(1.2);
    doc.line(margin, y, pageWidth - margin, y);
    y += 26;

    doc.setFontSize(11);
    doc.setTextColor(20, 20, 20);
    const lineHeight = 15;
    const paraGap = 12;

    filled.forEach(paragraph => {
      const isSignoffName = paragraph === 'Aziz Bek';
      doc.setFont('helvetica', isSignoffName ? 'bold' : 'normal');
      const lines = doc.splitTextToSize(paragraph, usableWidth);

      if (y + lines.length * lineHeight > pageHeight - margin) {
        doc.addPage();
        y = margin + 6;
      }

      doc.text(lines, margin, y);
      y += lines.length * lineHeight + paraGap;
    });

    return doc.output('blob');
  }

  document.getElementById('downloadPdfBtn').addEventListener('click', async () => {
    if (!window.jspdf) {
      showToast('PDF library still loading — try again in a second.');
      return;
    }
    const blob = buildPdfBlob();
    const { company } = currentValues();
    const safeName = company.replace(/[^a-z0-9]+/gi, '_').replace(/^_+|_+$/g, '') || 'Company';
    const filename = `Aziz_Bek_Cover_Letter_${safeName}.pdf`;

    try {
      const downloads = await claude.use('downloads');
      if (downloads) {
        await downloads.save({ filename, data: blob });
        showToast('Download started');
        return;
      }
    } catch (e) {
      // fall through to blob fallback
    }

    try {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Download started');
    } catch (e) {
      showToast('Download not available — try Copy instead.');
    }
  });
</script>
</body>
</html>
